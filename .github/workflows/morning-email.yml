name: Personalized Morning Email

on:
  schedule:
    # 00:00 IST = 18:30 UTC on the previous UTC calendar day
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-email-agent
  cancel-in-progress: false

jobs:
  send-morning-email:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run morning email agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          gmail: ${{ secrets.GMAIL }}
          google_app_pass: ${{ secrets.GOOGLE_APP_PASS }}
          RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          CITY: ${{ vars.CITY }}
          REGION: ${{ vars.REGION }}
          COUNTRY: ${{ vars.COUNTRY }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python -u run.py
